name: Comprobar datos Patache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Validar JSON
        run: python3 -m json.tool docs/patache_mmo_source.json >/dev/null
