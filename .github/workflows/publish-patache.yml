name: Publicar datos Patache

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: patache-pages
  cancel-in-progress: true

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolectar SMTR Patache
        env:
          PATACHE_USER: ${{ secrets.PATACHE_USER }}
          PATACHE_PASSWORD: ${{ secrets.PATACHE_PASSWORD }}
        run: python3 patache_collector.py --out public/patache_latest.json

      - name: Validar fuente para MMO
        run: python3 patache_source.py public/patache_latest.json > public/patache_mmo_source.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar publicacion
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar JSON
        id: deployment
        uses: actions/deploy-pages@v4
